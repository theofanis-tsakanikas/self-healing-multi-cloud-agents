[project]
name = "multi-cloud-self-healing-agent"
version = "0.1.0"
description = "Cloud-agnostic self-healing data engineering agent supporting AWS, Azure, and GCP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Faker>=37.0.0",
    "black>=26.3.1",
    "boto3>=1.42.86",
    "isort>=8.0.1",
    "langchain>=1.2.15",
    "langchain-core>=1.2.28",
    "langchain-openai>=1.1.12",
    "langgraph>=1.1.6",
    "numpy>=2.4.4",
    "openai>=2.31.0",
    "pandas>=3.0.2",
    "pinecone>=8.1.2",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.2",
    "python-terraform>=0.10.1",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.49",
    # Azure SDK
    "azure-storage-blob>=12.22.0",
    "azure-identity>=1.16.0",
    "adlfs>=2024.2.0",
    # GCP SDK
    "google-cloud-storage>=2.16.0",
    "gcsfs>=2024.2.0",
    # Parquet & storage
    "pyarrow>=16.0.0",
    "s3fs>=2024.3.0",
    # Web UI
    "streamlit>=1.33.0",
    # Trino client
    "trino>=0.328.0",
    # Prometheus metrics
    "prometheus-client>=0.20.0",
    # MySQL driver for GCP Cloud SQL
    "pymysql>=1.1.1",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=0.3.0"]
vertexai = ["langchain-google-vertexai>=2.0.0"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
