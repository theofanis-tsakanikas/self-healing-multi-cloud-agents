[project]
name = "multi-cloud-self-healing-agent"
version = "1.0.0"
description = "Cloud-agnostic self-healing data engineering agent supporting AWS, Azure, GCP, and Databricks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Faker>=37.0.0",
    "boto3>=1.42.86",
    "langchain>=1.2.15",
    "langchain-core>=1.2.28",
    "langchain-openai>=1.1.12",
    "langgraph>=1.1.6",
    "numpy>=2.4.4",
    "openai>=2.31.0",
    "pandas>=3.0.2",
    "pinecone>=8.1.2",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.2",
    "python-terraform>=0.10.1",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.49",
    # Azure SDK
    "azure-storage-blob>=12.22.0",
    "azure-identity>=1.16.0",
    "adlfs>=2024.2.0",
    # GCP SDK
    "google-cloud-storage>=2.16.0",
    "gcsfs>=2024.2.0",
    # Parquet & storage
    "pyarrow>=16.0.0",
    "s3fs>=2024.3.0",
    # Web UI
    "streamlit>=1.33.0",
    # Trino client
    "trino>=0.328.0",
    # Prometheus metrics
    "prometheus-client>=0.20.0",
    # MySQL driver for GCP Cloud SQL
    "pymysql>=1.1.1",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=0.3.0"]
vertexai = ["langchain-google-vertexai>=2.0.0"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.15.14",
    # Exercises the opt-in durable checkpointer path (graph._build_checkpointer). Production installs
    # this too when LANGGRAPH_CHECKPOINT_DB is used; keeping it dev-only leaves the default install lean.
    "langgraph-checkpoint-sqlite>=2.0.0",
]

[tool.uv]
# The project never runs on Windows (CI = ubuntu, local dev = macOS, pipeline
# images = linux). Without this, uv resolves the lock for ALL platforms incl.
# the `python >= 3.14 + win32` split, where older dependency floors have no
# solution — which made Dependabot's uv updater fail with
# dependency_file_not_resolvable.
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
]

[tool.ruff]
# Generated pipeline scripts are agent OUTPUTS validated by their own gate
# (validate_generated_code runs targeted ruff rules at generation time) — the
# repo-wide lint covers the agent system itself, not the artifacts it produces.
extend-exclude = ["scripts/pipe_*.py"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
# Measure the deterministic orchestration logic we actually unit-test. The big
# LLM-driven node bodies and external I/O are integration/eval-deferred.
source = ["agents", "utils"]
omit = [
    "*/__init__.py",
    "utils/nlp_parser.py",        # NL-input parsing (Streamlit path) — separate surface
    "utils/dataset_analyzer.py",
    "utils/cost_estimator.py",
    "utils/architecture_advisor.py",
    "utils/observability.py",
    "utils/trino_client.py",
]

[tool.coverage.report]
show_missing = true
# Regression FLOOR, not a quality target. The LLM-driven node bodies (architect_node,
# infra_node, medic_node) are integration/eval-deferred, so total line coverage is
# dominated by intentionally-untested code. This floor guards the deterministic logic
# (validators, routing, cloud_get, state helpers) from silently losing coverage.
# Raise it whenever real coverage grows (22 at ~26% real → 28 at ~32% → 45 with real at ~53%
# after the professionalization pass added tests for the deterministic core + new modules).
fail_under = 45
