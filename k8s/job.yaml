apiVersion: batch/v1
kind: Job
metadata:
  name: pipe-mkt-global-to-gcp-job
  namespace: analytics
  labels:
    project_id: pipe_mkt_global_to_gcp
    component: pipeline-job
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        project_id: pipe_mkt_global_to_gcp
        component: pipeline-job
    spec:
      serviceAccountName: global-mkt-insights-sa
      restartPolicy: Never
      initContainers:
      - name: init-trino
        image: trinodb/trino:403
        command:
        - /bin/sh
        - -c
        - |
          until trino --server http://trino.analytics.svc.cluster.local:8080 --execute "SELECT 1" > /dev/null 2>&1; do
            echo "Waiting for Trino to be ready..."; sleep 5;
          done
          trino --server http://trino.analytics.svc.cluster.local:8080 --file /scripts/setup_trino.sql
        volumeMounts:
        - name: sql-scripts
          mountPath: /scripts
      containers:
      - name: pipeline
        image: europe-west3-docker.pkg.dev/multi-cloud-self-healing-agent/multi-cloud-agent-repo:latest
        env:
        - name: PROJECT_ID
          value: "pipe_mkt_global_to_gcp"
        - name: CLOUD_PROVIDER
          value: "gcp"
        - name: DESTINATION_URI
          value: "gs://global-marketing-insights-data/processed/"
        - name: TRINO_HOST
          value: "trino.analytics.svc.cluster.local"
        - name: PUSHGATEWAY_URL
          value: "http://pushgateway.monitoring.svc.cluster.local:9091"
        envFrom:
        - secretRef:
            name: pipe-mkt-global-to-gcp-db-credentials
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        volumeMounts:
        - name: sql-scripts
          mountPath: /scripts
      volumes:
      - name: sql-scripts
        configMap:
          name: trino-sql-config
