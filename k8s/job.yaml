apiVersion: batch/v1
kind: Job
metadata:
  name: pipe-eu-sales-to-s3-job
  namespace: analytics
  labels:
    project_id: pipe_eu_sales_to_s3
    component: pipeline-job
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        project_id: pipe_eu_sales_to_s3
        component: pipeline-job
    spec:
      serviceAccountName: eu-sales-insights-sa
      restartPolicy: Never
      initContainers:
      - name: init-trino
        image: trinodb/trino:403
        command:
        - /bin/sh
        - -c
        - |
          until trino --server http://trino.analytics.svc.cluster.local:8080 --execute "SELECT 1" > /dev/null 2>&1; do
            echo "Waiting for Trino to be ready..."; sleep 5;
          done
          trino --server http://trino.analytics.svc.cluster.local:8080 --file /scripts/setup_trino.sql
        volumeMounts:
        - name: sql-scripts
          mountPath: /scripts
      containers:
      - name: pipeline
        image: RESOLVE_FROM_EXECUTE_TERRAFORM_OUTPUT
        env:
        - name: PROJECT_ID
          value: "pipe_eu_sales_to_s3"
        - name: CLOUD_PROVIDER
          value: "aws"
        - name: DESTINATION_URI
          value: "s3://eu-sales-insights-data/processed/"
        - name: TRINO_HOST
          value: "trino.analytics.svc.cluster.local"
        - name: PUSHGATEWAY_URL
          value: "http://pushgateway.monitoring.svc.cluster.local:9091"
        envFrom:
        - secretRef:
            name: pipe-eu-sales-to-s3-db-credentials
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        volumeMounts:
        - name: sql-scripts
          mountPath: /scripts
      volumes:
      - name: sql-scripts
        configMap:
          name: trino-sql-config
