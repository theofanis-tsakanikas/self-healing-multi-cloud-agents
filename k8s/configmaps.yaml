apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-sql-config
  namespace: analytics
  labels:
    project_id: pipe-eu-sales-to-s3
data:
  setup_trino.sql: |
    CREATE SCHEMA IF NOT EXISTS hive.sales_eu;
    DROP TABLE IF EXISTS hive.sales_eu.pipe_eu_sales_to_s3;
    CREATE TABLE hive.sales_eu.pipe_eu_sales_to_s3 (
        order_id    VARCHAR,
        unit_price  DECIMAL(18,2),
        quantity    INTEGER,
        order_date  TIMESTAMP,
        currency    VARCHAR,
        is_suspicious BOOLEAN,
        run_date    DATE
    ) WITH (
        format            = 'PARQUET',
        external_location = 's3://eu-sales-insights-data/processed/',
        partitioned_by    = ARRAY['run_date']
    );
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hive-catalog-config
  namespace: analytics
  labels:
    project_id: pipe-eu-sales-to-s3
data:
  hive.properties: |
    connector.name=hive
    hive.metastore=glue
    hive.metastore.glue.region=eu-central-1
    hive.s3.region=eu-central-1
    hive.s3.path-style-access=true
    hive.allow-drop-table=true
    hive.allow-rename-table=true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dash-config
  namespace: monitoring
  labels:
    project_id: pipe-eu-sales-to-s3
data:
  monitoring_specs.json: |
    {
      "uid": "eu-sales-data-observability",
      "title": "EU Sales Data Observability",
      "schemaVersion": 37,
      "version": 1,
      "refresh": "5m",
      "time": { "from": "now-6h", "to": "now" },
      "tags": ["data-pipeline", "eu-sales", "aws"],
      "templating": {
        "list": [
          {
            "name": "cloud_provider",
            "type": "query",
            "datasource": "Prometheus",
            "query": "label_values(pipeline_rows_processed_total, cloud_provider)",
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "label": "Cloud"
          },
          {
            "name": "project_id",
            "type": "query",
            "datasource": "Prometheus",
            "query": "label_values(pipeline_rows_processed_total{cloud_provider=~\"$cloud_provider\"}, project_id)",
            "refresh": 2,
            "includeAll": true,
            "label": "Pipeline Run"
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Record Count",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "pipeline_rows_processed_total{cloud_provider=~\"$cloud_provider\", project_id=~\"$project_id\"}",
              "legendFormat": "{{cloud_provider}} / {{project_id}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "Freshness",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "pipeline_last_success_timestamp{cloud_provider=~\"$cloud_provider\", project_id=~\"$project_id\"}",
              "legendFormat": "{{cloud_provider}} / {{project_id}}"
            }
          ]
        }
      ],
      "alerting": {
        "name": "EU Sales — Data Silence Alert",
        "condition": "no data for 60 minutes",
        "severity": "critical",
        "for": "60m",
        "labels": { "severity": "critical", "pipeline": "eu-sales", "cloud_provider": "aws" },
        "annotations": { "summary": "No data received for EU Sales pipeline (AWS) in the last 60 minutes." }
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-config
  namespace: monitoring
  labels:
    project_id: pipe-eu-sales-to-s3
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
  labels:
    project_id: pipe-eu-sales-to-s3
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: pushgateway
        static_configs:
          - targets: ['pushgateway.monitoring.svc.cluster.local:9091']
        honor_labels: true