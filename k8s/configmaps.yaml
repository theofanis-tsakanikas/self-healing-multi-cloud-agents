apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-sql-config
  namespace: analytics
  labels:
    project_id: pipe-crm-us-to-azure
data:
  setup_trino.sql: |
    CREATE SCHEMA IF NOT EXISTS hive.crm_us;
    DROP TABLE IF EXISTS hive.crm_us.pipe_crm_us_to_azure;
    CREATE TABLE hive.crm_us.pipe_crm_us_to_azure (
        cust_id BIGINT,
        full_name VARCHAR,
        email_address VARCHAR,
        phone_number VARCHAR,
        is_suspicious BOOLEAN,
        run_date DATE
    ) WITH (
        format = 'PARQUET',
        external_location = 'abfss://us-crm-insights-data@uscrminsightsstorage.dfs.core.windows.net/processed/',
        partitioned_by = ARRAY['run_date']
    );
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hive-catalog-config
  namespace: analytics
  labels:
    project_id: pipe-crm-us-to-azure
data:
  hive.properties: |
    connector.name=hive
    hive.metastore=file
    hive.metastore.catalog.dir=abfss://us-crm-insights-data@uscrminsightsstorage.dfs.core.windows.net/metastore/
    hive.azure.abfs-storage-account=uscrminsightsstorage
    hive.azure.abfs-access-key=__ABFS_KEY__
    hive.allow-drop-table=true
    hive.allow-rename-table=true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dash-config
  namespace: monitoring
  labels:
    project_id: pipe-crm-us-to-azure
data:
  dashboard-provider.yaml: |
    apiVersion: 1
    providers:
    - name: default
      orgId: 1
      folder: ''
      type: file
      disableDeletion: false
      editable: true
      options:
        path: /etc/grafana/provisioning/dashboards
  monitoring_specs.json: |
    {
      "uid": "pipe-crm-us-to-azure-dashboard",
      "title": "US CRM to Azure Data Observability",
      "schemaVersion": 37,
      "version": 1,
      "refresh": "5m",
      "time": { "from": "now-6h", "to": "now" },
      "tags": ["data-pipeline", "us-crm"],
      "panels": [
        {
          "id": 1,
          "title": "Record Count",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "pipeline_rows_processed_total{project_id=\"unknown\"}",
              "legendFormat": "Rows Processed"
            }
          ]
        },
        {
          "id": 2,
          "title": "Freshness",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "pipeline_last_success_timestamp{project_id=\"unknown\"}",
              "legendFormat": "Last Success"
            }
          ]
        },
        {
          "id": 3,
          "title": "Rejection Rate",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "pipeline_rows_rejected_total{project_id=\"unknown\"} / clamp_min(pipeline_rows_processed_total{project_id=\"unknown\"} + pipeline_rows_rejected_total{project_id=\"unknown\"}, 1) * 100",
              "legendFormat": "Rejection Rate"
            }
          ]
        },
        {
          "id": 4,
          "title": "Run Duration",
          "type": "gauge",
          "datasource": "Prometheus",
          "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "pipeline_duration_seconds{project_id=\"unknown\"}",
              "legendFormat": "Duration"
            }
          ]
        },
        {
          "id": 5,
          "title": "Rejections by Reason",
          "type": "piechart",
          "datasource": "Prometheus",
          "gridPos": { "x": 0, "y": 16, "w": 24, "h": 8 },
          "targets": [
            {
              "expr": "pipeline_rows_rejected_by_reason{project_id=\"unknown\"}",
              "legendFormat": "{{reason}}"
            }
          ]
        }
      ],
      "alerting": {
        "name": "Data Silence Alert",
        "condition": "no data for 60 minutes",
        "severity": "critical",
        "for": "60m",
        "labels": { "severity": "critical", "project_id": "unknown" },
        "annotations": { "summary": "No data received for US CRM to Azure pipeline in the last 60 minutes." }
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-config
  namespace: monitoring
  labels:
    project_id: pipe-crm-us-to-azure
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
  labels:
    project_id: pipe-crm-us-to-azure
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: pushgateway
        static_configs:
          - targets: ['pushgateway.monitoring.svc.cluster.local:9091']
        honor_labels: true