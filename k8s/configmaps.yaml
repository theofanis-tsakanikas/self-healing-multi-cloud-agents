apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-sql-config
  namespace: analytics
  labels:
    project_id: pipe-crm-us-to-azure
data:
  setup_trino.sql: |
    CREATE SCHEMA IF NOT EXISTS azure_catalog.crm_us;
    DROP TABLE IF EXISTS azure_catalog.crm_us.pipe_crm_us_to_azure;
    CREATE TABLE azure_catalog.crm_us.pipe_crm_us_to_azure (
        cust_id     BIGINT,
        full_name   VARCHAR,
        email_address VARCHAR,
        phone_number VARCHAR,
        is_suspicious BOOLEAN,
        run_date    DATE
    ) WITH (
        format            = 'PARQUET',
        external_location = 'abfss://us-crm-insights-data@uscrminsightsstorage.dfs.core.windows.net/processed/',
        partitioned_by    = ARRAY['run_date']
    );
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hive-catalog-config
  namespace: analytics
  labels:
    project_id: pipe-crm-us-to-azure
data:
  hive.properties: |
    connector.name=hive
    hive.metastore=file
    hive.metastore.catalog.dir=abfss://us-crm-insights-data@uscrminsightsstorage.dfs.core.windows.net/metastore/
    hive.azure.abfs-storage-account=uscrminsightsstorage
    hive.azure.abfs-access-key=__ABFS_KEY__
    hive.allow-drop-table=true
    hive.allow-rename-table=true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dash-config
  namespace: monitoring
  labels:
    project_id: pipe-crm-us-to-azure
data:
  dashboard-provider.yaml: |
    apiVersion: 1
    providers:
    - name: default
      orgId: 1
      folder: ''
      type: file
      disableDeletion: false
      editable: true
      options:
        path: /etc/grafana/provisioning/dashboards
  monitoring_specs.json: |
    {
      "uid": "us-crm-data-observability",
      "title": "US CRM Data Observability",
      "schemaVersion": 37,
      "version": 1,
      "refresh": "5m",
      "time": { "from": "now-6h", "to": "now" },
      "tags": ["data-pipeline", "us-crm", "azure"],
      "templating": {
        "list": [
          {
            "name": "cloud_provider",
            "type": "query",
            "datasource": "Prometheus",
            "query": "label_values(pipeline_rows_processed_total, cloud_provider)",
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "label": "Cloud"
          },
          {
            "name": "project_id",
            "type": "query",
            "datasource": "Prometheus",
            "query": "label_values(pipeline_rows_processed_total{cloud_provider=~\"$cloud_provider\"}, project_id)",
            "refresh": 2,
            "includeAll": true,
            "label": "Pipeline Run"
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Record Count",
          "type": "stat",
          "datasource": "Prometheus",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "fieldConfig": { "defaults": { "color": { "mode": "fixed", "fixedColor": "green" }, "graphMode": "area" } },
          "targets": [
            {
              "expr": "pipeline_rows_processed_total{cloud_provider=~\"$cloud_provider\", project_id=~\"$project_id\"}",
              "legendFormat": "{{cloud_provider}} / {{project_id}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "Last Success",
          "type": "stat",
          "datasource": "Prometheus",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "fieldConfig": {
            "defaults": {
              "unit": "time:YYYY-MM-DD HH:mm:ss",
              "color": { "mode": "fixed", "fixedColor": "blue" }
            }
          },
          "targets": [
            {
              "expr": "pipeline_last_success_timestamp{cloud_provider=~\"$cloud_provider\", project_id=~\"$project_id\"} * 1000",
              "legendFormat": "{{cloud_provider}} / {{project_id}}"
            }
          ]
        },
        {
          "id": 3,
          "title": "Rejection Rate",
          "type": "stat",
          "datasource": "Prometheus",
          "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 },
          "options": { "colorMode": "value", "graphMode": "none", "textMode": "value" },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "yellow", "value": 20 },
                { "color": "red", "value": 50 }
              ] }
            }
          },
          "targets": [
            {
              "expr": "pipeline_rows_rejected_total{cloud_provider=~\"$cloud_provider\", project_id=~\"$project_id\"} / clamp_min(pipeline_rows_processed_total{cloud_provider=~\"$cloud_provider\", project_id=~\"$project_id\"} + pipeline_rows_rejected_total{cloud_provider=~\"$cloud_provider\", project_id=~\"$project_id\"}, 1) * 100",
              "legendFormat": "{{cloud_provider}} / {{project_id}}"
            }
          ]
        },
        {
          "id": 4,
          "title": "Run Duration",
          "type": "gauge",
          "datasource": "Prometheus",
          "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "yellow", "value": 60 },
                { "color": "red", "value": 120 }
              ] }
            }
          },
          "targets": [
            {
              "expr": "pipeline_duration_seconds{cloud_provider=~\"$cloud_provider\", project_id=~\"$project_id\"}",
              "legendFormat": "{{cloud_provider}} / {{project_id}}"
            }
          ]
        },
        {
          "id": 5,
          "title": "Rejections by Reason",
          "type": "piechart",
          "datasource": "Prometheus",
          "gridPos": { "x": 0, "y": 16, "w": 24, "h": 8 },
          "options": {
            "pieType": "pie",
            "legend": { "displayMode": "table", "placement": "right", "values": ["value", "percent"] },
            "reduceOptions": { "values": false, "calcs": ["lastNotNull"] }
          },
          "targets": [
            {
              "expr": "pipeline_rows_rejected_by_reason{cloud_provider=~\"$cloud_provider\", project_id=~\"$project_id\"}",
              "legendFormat": "{{reason}}"
            }
          ]
        }
      ],
      "alerting": {
        "name": "US CRM — Data Silence Alert",
        "condition": "no data for 60 minutes",
        "severity": "critical",
        "for": "60m",
        "labels": { "severity": "critical", "pipeline": "us-crm", "cloud_provider": "azure" },
        "annotations": { "summary": "No data received for US CRM pipeline (Azure) in the last 60 minutes." }
      }
    }  
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-config
  namespace: monitoring
  labels:
    project_id: pipe-crm-us-to-azure
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
  labels:
    project_id: pipe-crm-us-to-azure
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: pushgateway
        static_configs:
          - targets: ['pushgateway.monitoring.svc.cluster.local:9091']
        honor_labels: true
