name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Azure CLI
        uses: azure/setup-azure@v1
        with:
          azure-subscription: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: mcselfhealagentacr.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Get AKS credentials
        run: az aks get-credentials --resource-group multi-cloud-agent-rg --name multi-cloud-agent-aks

      - name: Run Terraform
        run: |
          cd terraform
          terraform init
          terraform apply -auto-approve

      - name: Echo Deployment Complete
        run: echo "Deployment Complete"