# Promo demo — business rules to LOAD in Scene 2 / CLIP B ("…or load your own rules").
#
# These reference the REAL columns of the seeded source table `raw_eu_sales`
# (see scripts/seed_chaos.py): order_id, unit_price, quantity, order_date, currency.
# Each rule matches an anomaly the chaos seeder injects, so the deployed dashboard
# shows REAL rejections + flags (incl. a populated "Rejections by reason" piechart).
#
# Loaded via the NL surface's `parse_rules_from_content` (gpt-4o-mini) — explicit
# column + pandas condition + action make the extraction deterministic.

quality_standards:

  - rule_id: monetary_integrity
    target_column: unit_price
    condition: "df['unit_price'] > 0"
    action: DROP_RECORD
    reason: "Unit price must be strictly positive — zero/negative prices are corrupt and dropped."

  - rule_id: completeness_enforcement
    target_column: order_id
    condition: "df['order_id'].notna()"
    action: DROP_RECORD
    reason: "Every transaction must carry an order_id — rows missing it are dropped."

  - rule_id: temporal_validity
    target_column: order_date
    condition: "df['order_date'] <= today"
    action: EXCLUDE_AND_LOG
    reason: "Future-dated orders are impossible — excluded and logged for review."

  - rule_id: currency_standardization
    target_column: currency
    condition: "df['currency'].isin(['EUR', 'GBP'])"
    action: DEFAULT_VALUE
    reason: "Only EUR and GBP are supported corporate currencies; unknown codes default to EUR."

  - rule_id: quantity_validity
    target_column: quantity
    condition: "df['quantity'] > 0"
    action: FLAG_AS_SUSPICIOUS
    reason: "Negative quantities signal returns or entry errors — kept but flagged for audit."
