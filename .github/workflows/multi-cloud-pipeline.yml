name: Multi-Cloud Self-Healing Data Pipeline

on:
  workflow_dispatch:
    inputs:
      cloud:
        description: 'Target cloud provider'
        type: choice
        default: aws
        options: [aws, azure, gcp, all]
      pipeline:
        description: 'Which pipeline to run?'
        type: choice
        default: skip
        options: [skip, eu_sales, us_crm, global_marketing, all]
      bootstrap_cloud:
        description: 'Bootstrap baseline infrastructure for which cloud?'
        type: choice
        default: skip
        options: [skip, aws, azure, gcp]
      bootstrap_action:
        description: 'Bootstrap action (apply or destroy)'
        type: choice
        default: apply
        options: [apply, destroy]
      chaos_target:
        description: 'Where to inject dirty data?'
        type: choice
        default: skip
        options: [skip, eu_sales, us_crm, global_marketing, all]
      db_type:
        description: 'Database type for chaos injection'
        type: choice
        default: postgres
        options: [postgres, mysql, sqlite]
      rows:
        description: 'Number of dirty rows to inject'
        type: string
        default: '100'
      ingest_knowledge:
        description: 'Sync knowledge base to Pinecone?'
        type: choice
        default: 'no'
        options: ['yes', 'no']

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      id-token: write  # Required for OIDC (GCP Workload Identity Federation)
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # ── AWS Authentication ──────────────────────────────────────────────────

      - name: Configure AWS credentials
        if: ${{ github.event.inputs.cloud == 'aws' || github.event.inputs.cloud == 'all' || github.event.inputs.bootstrap_cloud == 'aws' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      # ── Azure Authentication ────────────────────────────────────────────────

      - name: Azure Login
        if: ${{ github.event.inputs.cloud == 'azure' || github.event.inputs.cloud == 'all' || github.event.inputs.bootstrap_cloud == 'azure' }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ── GCP Authentication ──────────────────────────────────────────────────

      - name: Authenticate to GCP
        if: ${{ github.event.inputs.cloud == 'gcp' || github.event.inputs.cloud == 'all' || github.event.inputs.bootstrap_cloud == 'gcp' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud CLI
        if: ${{ github.event.inputs.cloud == 'gcp' || github.event.inputs.cloud == 'all' || github.event.inputs.bootstrap_cloud == 'gcp' }}
        uses: google-github-actions/setup-gcloud@v2

      # ── Bootstrap: AWS ─────────────────────────────────────────────────────

      - name: Capture Pipeline IAM ARN (AWS Bootstrap)
        if: ${{ github.event.inputs.bootstrap_cloud == 'aws' }}
        id: pipeline-arn
        run: echo "arn=$(aws sts get-caller-identity --query Arn --output text)" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials (Bootstrap IAM user)
        if: ${{ github.event.inputs.bootstrap_cloud == 'aws' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.BOOTSTRAP_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.BOOTSTRAP_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Bootstrap AWS Infrastructure
        if: ${{ github.event.inputs.bootstrap_cloud == 'aws' && github.event.inputs.bootstrap_action == 'apply' }}
        env:
          TF_VAR_region: ${{ vars.AWS_BOOTSTRAP_REGION }}
          TF_VAR_state_bucket: ${{ vars.AWS_BOOTSTRAP_STATE_BUCKET }}
          TF_VAR_lock_table: ${{ vars.AWS_BOOTSTRAP_LOCK_TABLE }}
          TF_VAR_ecr_repo_name: ${{ vars.AWS_BOOTSTRAP_ECR_REPO_NAME }}
          TF_VAR_eks_cluster_name: ${{ vars.AWS_BOOTSTRAP_EKS_CLUSTER_NAME }}
          TF_VAR_eks_version: ${{ vars.AWS_BOOTSTRAP_EKS_VERSION }}
          TF_VAR_cluster_role_name: ${{ vars.AWS_BOOTSTRAP_CLUSTER_ROLE_NAME }}
          TF_VAR_node_role_name: ${{ vars.AWS_BOOTSTRAP_NODE_ROLE_NAME }}
          TF_VAR_rds_db_name: ${{ secrets.POSTGRES_DB_NAME }}
          TF_VAR_rds_username: ${{ secrets.POSTGRES_DB_USER }}
          TF_VAR_rds_password: ${{ secrets.POSTGRES_DB_PASSWORD }}
          TF_VAR_rds_allowed_cidrs: ${{ vars.AWS_BOOTSTRAP_RDS_ALLOWED_CIDRS }}
          TF_VAR_pipeline_iam_arn: ${{ steps.pipeline-arn.outputs.arn }}
        run: |
          terraform -chdir=bootstrap/aws init
          terraform -chdir=bootstrap/aws apply -auto-approve

      - name: Destroy AWS Infrastructure
        if: ${{ github.event.inputs.bootstrap_cloud == 'aws' && github.event.inputs.bootstrap_action == 'destroy' }}
        env:
          TF_VAR_region: ${{ vars.AWS_BOOTSTRAP_REGION }}
          TF_VAR_state_bucket: ${{ vars.AWS_BOOTSTRAP_STATE_BUCKET }}
          TF_VAR_lock_table: ${{ vars.AWS_BOOTSTRAP_LOCK_TABLE }}
          TF_VAR_ecr_repo_name: ${{ vars.AWS_BOOTSTRAP_ECR_REPO_NAME }}
          TF_VAR_eks_cluster_name: ${{ vars.AWS_BOOTSTRAP_EKS_CLUSTER_NAME }}
          TF_VAR_eks_version: ${{ vars.AWS_BOOTSTRAP_EKS_VERSION }}
          TF_VAR_cluster_role_name: ${{ vars.AWS_BOOTSTRAP_CLUSTER_ROLE_NAME }}
          TF_VAR_node_role_name: ${{ vars.AWS_BOOTSTRAP_NODE_ROLE_NAME }}
          TF_VAR_rds_db_name: ${{ secrets.POSTGRES_DB_NAME }}
          TF_VAR_rds_username: ${{ secrets.POSTGRES_DB_USER }}
          TF_VAR_rds_password: ${{ secrets.POSTGRES_DB_PASSWORD }}
          TF_VAR_rds_allowed_cidrs: ${{ vars.AWS_BOOTSTRAP_RDS_ALLOWED_CIDRS }}
          TF_VAR_pipeline_iam_arn: ${{ steps.pipeline-arn.outputs.arn }}
        run: |
          terraform -chdir=bootstrap/aws init
          terraform -chdir=bootstrap/aws destroy -auto-approve

      - name: Restore AWS credentials (after bootstrap)
        if: ${{ github.event.inputs.bootstrap_cloud == 'aws' && github.event.inputs.bootstrap_action == 'apply' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      # ── Bootstrap: Azure ───────────────────────────────────────────────────

      - name: Bootstrap Azure Infrastructure
        if: ${{ github.event.inputs.bootstrap_cloud == 'azure' && github.event.inputs.bootstrap_action == 'apply' }}
        env:
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_resource_group_name: ${{ vars.AZURE_BOOTSTRAP_RG_NAME }}
          TF_VAR_location: ${{ vars.AZURE_BOOTSTRAP_LOCATION }}
          TF_VAR_aks_cluster_name: ${{ vars.AZURE_BOOTSTRAP_AKS_CLUSTER_NAME }}
          TF_VAR_acr_name: ${{ vars.AZURE_BOOTSTRAP_ACR_NAME }}
          TF_VAR_db_server_name: ${{ vars.AZURE_BOOTSTRAP_DB_SERVER_NAME }}
          TF_VAR_db_name: ${{ secrets.CRM_DB_NAME }}
          TF_VAR_db_username: ${{ secrets.CRM_DB_USER }}
          TF_VAR_db_password: ${{ secrets.CRM_DB_PASSWORD }}
        run: |
          terraform -chdir=bootstrap/azure init
          terraform -chdir=bootstrap/azure apply -auto-approve

      - name: Destroy Azure Infrastructure
        if: ${{ github.event.inputs.bootstrap_cloud == 'azure' && github.event.inputs.bootstrap_action == 'destroy' }}
        env:
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_resource_group_name: ${{ vars.AZURE_BOOTSTRAP_RG_NAME }}
          TF_VAR_location: ${{ vars.AZURE_BOOTSTRAP_LOCATION }}
          TF_VAR_aks_cluster_name: ${{ vars.AZURE_BOOTSTRAP_AKS_CLUSTER_NAME }}
          TF_VAR_acr_name: ${{ vars.AZURE_BOOTSTRAP_ACR_NAME }}
          TF_VAR_db_server_name: ${{ vars.AZURE_BOOTSTRAP_DB_SERVER_NAME }}
          TF_VAR_db_name: ${{ secrets.CRM_DB_NAME }}
          TF_VAR_db_username: ${{ secrets.CRM_DB_USER }}
          TF_VAR_db_password: ${{ secrets.CRM_DB_PASSWORD }}
        run: |
          terraform -chdir=bootstrap/azure init
          terraform -chdir=bootstrap/azure destroy -auto-approve

      # ── Bootstrap: GCP ─────────────────────────────────────────────────────

      - name: Bootstrap GCP Infrastructure
        if: ${{ github.event.inputs.bootstrap_cloud == 'gcp' && github.event.inputs.bootstrap_action == 'apply' }}
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ vars.GCP_BOOTSTRAP_REGION }}
          TF_VAR_gke_cluster_name: ${{ vars.GCP_BOOTSTRAP_GKE_CLUSTER_NAME }}
          TF_VAR_artifact_registry_name: ${{ vars.GCP_BOOTSTRAP_AR_REPO_NAME }}
          TF_VAR_db_instance_name: ${{ vars.GCP_BOOTSTRAP_DB_INSTANCE_NAME }}
          TF_VAR_db_name: ${{ secrets.MYSQL_DB_NAME }}
          TF_VAR_db_user: ${{ secrets.MYSQL_DB_USER }}
          TF_VAR_db_password: ${{ secrets.MYSQL_DB_PASSWORD }}
          TF_VAR_pipeline_github_repo: ${{ github.repository }}
        run: |
          terraform -chdir=bootstrap/gcp init
          terraform -chdir=bootstrap/gcp apply -auto-approve

      - name: Destroy GCP Infrastructure
        if: ${{ github.event.inputs.bootstrap_cloud == 'gcp' && github.event.inputs.bootstrap_action == 'destroy' }}
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ vars.GCP_BOOTSTRAP_REGION }}
          TF_VAR_gke_cluster_name: ${{ vars.GCP_BOOTSTRAP_GKE_CLUSTER_NAME }}
          TF_VAR_artifact_registry_name: ${{ vars.GCP_BOOTSTRAP_AR_REPO_NAME }}
          TF_VAR_db_instance_name: ${{ vars.GCP_BOOTSTRAP_DB_INSTANCE_NAME }}
          TF_VAR_db_name: ${{ secrets.MYSQL_DB_NAME }}
          TF_VAR_db_user: ${{ secrets.MYSQL_DB_USER }}
          TF_VAR_db_password: ${{ secrets.MYSQL_DB_PASSWORD }}
        run: |
          terraform -chdir=bootstrap/gcp init
          terraform -chdir=bootstrap/gcp destroy -auto-approve

      # ── Dependencies ───────────────────────────────────────────────────────

      - name: Install uv and dependencies
        if: ${{ github.event.inputs.bootstrap_action != 'destroy' }}
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.astral/bin" >> $GITHUB_PATH
          export PATH="$HOME/.astral/bin:$PATH"
          make install

      # ── Chaos & Knowledge Base ─────────────────────────────────────────────

      - name: Seed Dirty Data (Optional)
        if: ${{ github.event.inputs.chaos_target != 'skip' && github.event.inputs.bootstrap_action != 'destroy' }}
        env:
          POSTGRES_DB_HOST: ${{ secrets.POSTGRES_DB_HOST }}
          POSTGRES_DB_PORT: ${{ secrets.POSTGRES_DB_PORT }}
          POSTGRES_DB_USER: ${{ secrets.POSTGRES_DB_USER }}
          POSTGRES_DB_PASSWORD: ${{ secrets.POSTGRES_DB_PASSWORD }}
          POSTGRES_DB_NAME: ${{ secrets.POSTGRES_DB_NAME }}
          CRM_DB_HOST: ${{ secrets.CRM_DB_HOST }}
          CRM_DB_PORT: ${{ secrets.CRM_DB_PORT }}
          CRM_DB_USER: ${{ secrets.CRM_DB_USER }}
          CRM_DB_PASSWORD: ${{ secrets.CRM_DB_PASSWORD }}
          CRM_DB_NAME: ${{ secrets.CRM_DB_NAME }}
          MYSQL_DB_HOST: ${{ secrets.MYSQL_DB_HOST }}
          MYSQL_DB_PORT: ${{ secrets.MYSQL_DB_PORT }}
          MYSQL_DB_USER: ${{ secrets.MYSQL_DB_USER }}
          MYSQL_DB_PASSWORD: ${{ secrets.MYSQL_DB_PASSWORD }}
          MYSQL_DB_NAME: ${{ secrets.MYSQL_DB_NAME }}
        run: |
          make chaos \
            target=${{ github.event.inputs.chaos_target }} \
            db_type=${{ github.event.inputs.db_type }} \
            rows=${{ github.event.inputs.rows }}

      - name: Sync Knowledge Base to Pinecone (Optional)
        if: ${{ github.event.inputs.ingest_knowledge == 'yes' && github.event.inputs.bootstrap_action != 'destroy' }}
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
        run: make ingest

      # ── Cloud Registry & Kubeconfig ────────────────────────────────────────

      - name: Login to Amazon ECR
        if: ${{ (github.event.inputs.cloud == 'aws' || github.event.inputs.cloud == 'all') && github.event.inputs.pipeline != 'skip' && github.event.inputs.bootstrap_action != 'destroy' }}
        uses: aws-actions/amazon-ecr-login@v2

      - name: Configure kubectl for EKS
        if: ${{ (github.event.inputs.cloud == 'aws' || github.event.inputs.cloud == 'all') && github.event.inputs.pipeline != 'skip' && github.event.inputs.bootstrap_action != 'destroy' }}
        run: |
          aws eks update-kubeconfig \
            --region ${{ secrets.AWS_DEFAULT_REGION }} \
            --name ${{ vars.AWS_BOOTSTRAP_EKS_CLUSTER_NAME }}

      - name: Login to Azure Container Registry
        if: ${{ (github.event.inputs.cloud == 'azure' || github.event.inputs.cloud == 'all') && github.event.inputs.pipeline != 'skip' && github.event.inputs.bootstrap_action != 'destroy' }}
        uses: azure/docker-login@v1
        with:
          login-server: ${{ vars.AZURE_BOOTSTRAP_ACR_NAME }}.azurecr.io
          username: ${{ secrets.AZURE_CLIENT_ID }}
          password: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Configure kubectl for AKS
        if: ${{ (github.event.inputs.cloud == 'azure' || github.event.inputs.cloud == 'all') && github.event.inputs.pipeline != 'skip' && github.event.inputs.bootstrap_action != 'destroy' }}
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AZURE_BOOTSTRAP_RG_NAME }} \
            --name ${{ vars.AZURE_BOOTSTRAP_AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Configure Docker for Artifact Registry (GCP)
        if: ${{ (github.event.inputs.cloud == 'gcp' || github.event.inputs.cloud == 'all') && github.event.inputs.pipeline != 'skip' && github.event.inputs.bootstrap_action != 'destroy' }}
        run: gcloud auth configure-docker ${{ vars.GCP_BOOTSTRAP_REGION }}-docker.pkg.dev --quiet

      - name: Configure kubectl for GKE
        if: ${{ (github.event.inputs.cloud == 'gcp' || github.event.inputs.cloud == 'all') && github.event.inputs.pipeline != 'skip' && github.event.inputs.bootstrap_action != 'destroy' }}
        run: |
          gcloud container clusters get-credentials ${{ vars.GCP_BOOTSTRAP_GKE_CLUSTER_NAME }} \
            --region ${{ vars.GCP_BOOTSTRAP_REGION }} \
            --project ${{ secrets.GCP_PROJECT_ID }}

      # ── Run Self-Healing Agent ─────────────────────────────────────────────

      - name: Run Self-Healing Agent
        if: ${{ github.event.inputs.pipeline != 'skip' && github.event.inputs.bootstrap_action != 'destroy' }}
        env:
          # ── AI & Knowledge Base ──
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
          LANGCHAIN_TRACING_V2: ${{ secrets.LANGCHAIN_TRACING_V2 }}
          LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
          LANGCHAIN_PROJECT: ${{ secrets.LANGCHAIN_PROJECT }}

          # ── AWS ──
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}

          # ── Azure ──
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

          # ── GCP ──
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: "configs/keys/gcp-service-account.json"

          # ── Monitoring & Automation ──
          GRAFANA_API_KEY: ${{ secrets.GRAFANA_API_KEY }}
          TRINO_USER: ${{ secrets.TRINO_USER }}
          TRINO_PASSWORD: ${{ secrets.TRINO_PASSWORD }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

          # ── Fixed ──
          PROJECT_ENV: production
          LOG_LEVEL: INFO

          # ── Databases ──
          POSTGRES_DB_HOST: ${{ secrets.POSTGRES_DB_HOST }}
          POSTGRES_DB_PORT: ${{ secrets.POSTGRES_DB_PORT }}
          POSTGRES_DB_USER: ${{ secrets.POSTGRES_DB_USER }}
          POSTGRES_DB_PASSWORD: ${{ secrets.POSTGRES_DB_PASSWORD }}
          POSTGRES_DB_NAME: ${{ secrets.POSTGRES_DB_NAME }}
          CRM_DB_HOST: ${{ secrets.CRM_DB_HOST }}
          CRM_DB_PORT: ${{ secrets.CRM_DB_PORT }}
          CRM_DB_USER: ${{ secrets.CRM_DB_USER }}
          CRM_DB_PASSWORD: ${{ secrets.CRM_DB_PASSWORD }}
          CRM_DB_NAME: ${{ secrets.CRM_DB_NAME }}
          MYSQL_DB_HOST: ${{ secrets.MYSQL_DB_HOST }}
          MYSQL_DB_PORT: ${{ secrets.MYSQL_DB_PORT }}
          MYSQL_DB_USER: ${{ secrets.MYSQL_DB_USER }}
          MYSQL_DB_PASSWORD: ${{ secrets.MYSQL_DB_PASSWORD }}
          MYSQL_DB_NAME: ${{ secrets.MYSQL_DB_NAME }}

        run: |
          TARGET_CLOUD="${{ github.event.inputs.cloud }}"
          TARGET_PIPELINE="${{ github.event.inputs.pipeline }}"

          run_pipeline() {
            local pipeline=$1
            echo ">>> Running pipeline: $pipeline"
            make run p=$pipeline
          }

          if [ "$TARGET_PIPELINE" = "all" ]; then
            run_pipeline eu_sales
            run_pipeline us_crm
            run_pipeline global_marketing
          else
            run_pipeline $TARGET_PIPELINE
          fi
