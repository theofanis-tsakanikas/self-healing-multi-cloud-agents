name: Deploy Pipeline

on:
  push:
    paths: ['Dockerfile', 'scripts/**', 'k8s/**', 'sql/**', 'dashboards/**', 'requirements.txt']

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Cloud Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_JSON }}

      - name: Setup Gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: 'gke-gcloud-auth-plugin'

      - name: Configure Docker
        run: gcloud auth configure-docker europe-west3-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        run: |
          docker build -t europe-west3-docker.pkg.dev/multi-cloud-self-healing-agent/multi-cloud-agent-repo/pipe-mkt-global-to-gcp-20260606-0505:${{ github.sha }} -f Dockerfile .
          docker push europe-west3-docker.pkg.dev/multi-cloud-self-healing-agent/multi-cloud-agent-repo/pipe-mkt-global-to-gcp-20260606-0505:${{ github.sha }}
          docker tag europe-west3-docker.pkg.dev/multi-cloud-self-healing-agent/multi-cloud-agent-repo/pipe-mkt-global-to-gcp-20260606-0505:${{ github.sha }} europe-west3-docker.pkg.dev/multi-cloud-self-healing-agent/multi-cloud-agent-repo/pipe-mkt-global-to-gcp-20260606-0505:latest
          docker push europe-west3-docker.pkg.dev/multi-cloud-self-healing-agent/multi-cloud-agent-repo/pipe-mkt-global-to-gcp-20260606-0505:latest

      - name: Update Kubeconfig
        run: gcloud container clusters get-credentials multi-cloud-agent-gke --region europe-west3 --project multi-cloud-self-healing-agent

      - name: Set Image Tag in Job Manifest
        run: |
          sed -i 's|image: europe-west3-docker.pkg.dev/multi-cloud-self-healing-agent/multi-cloud-agent-repo/pipe-mkt-global-to-gcp-20260606-0505:.*|image: europe-west3-docker.pkg.dev/multi-cloud-self-healing-agent/multi-cloud-agent-repo/pipe-mkt-global-to-gcp-20260606-0505:${{ github.sha }}|' k8s/job.yaml

      - name: Deploy Shared Services to Kubernetes
        run: |
          kubectl apply -f k8s/00_namespaces.yaml
          kubectl apply -f k8s/configmaps.yaml
          kubectl apply -f k8s/trino_deployment.yaml
          kubectl apply -f k8s/grafana_deployment.yaml
          kubectl apply -f k8s/prometheus_deployment.yaml

      - name: Create DB Credentials Secret
        run: |
          kubectl create secret generic pipe-mkt-global-to-gcp-db-credentials -n analytics \
            --from-literal=MYSQL_DB_HOST=${{ vars.MYSQL_DB_HOST }} \
            --from-literal=MYSQL_DB_PORT=${{ vars.MYSQL_DB_PORT }} \
            --from-literal=MYSQL_DB_USER=${{ vars.MYSQL_DB_USER }} \
            --from-literal=MYSQL_DB_NAME=${{ vars.MYSQL_DB_NAME }} \
            --from-literal=MYSQL_DB_PASSWORD=${{ secrets.MYSQL_DB_PASSWORD }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Pipeline Job to Kubernetes
        run: |
          kubectl delete job -l component=pipeline-job -n analytics --ignore-not-found=true
          kubectl apply -f k8s/job.yaml

      - name: Check Deployment Status
        run: |
          kubectl get pods -n analytics
          kubectl get pods -n monitoring
          for i in $(seq 1 60); do
            SUCCEEDED=$(kubectl get job -l component=pipeline-job -n analytics -o jsonpath='{.items[0].status.succeeded}' 2>/dev/null)
            FAILED=$(kubectl get job -l component=pipeline-job -n analytics -o jsonpath='{.items[0].status.failed}' 2>/dev/null)
            if [ "${SUCCEEDED:-0}" = "1" ]; then
              echo "Job completed successfully"; exit 0
            fi
            if [ "${FAILED:-0}" -gt 0 ]; then
              echo "Job failed. Fetching logs..."
              echo "=== init-trino logs ==="
              kubectl logs -l component=pipeline-job -n analytics -c init-trino --tail=50 2>/dev/null || echo "(init-trino logs unavailable)"
              echo "=== pipeline logs ==="
              kubectl logs -l component=pipeline-job -n analytics -c pipeline --tail=100 2>/dev/null || echo "(pipeline logs unavailable)"
              exit 1
            fi
            echo "Waiting for job... ($i/60)"; sleep 10
          done
          echo "Timeout waiting for job"
          echo "=== init-trino logs ==="
          kubectl logs -l component=pipeline-job -n analytics -c init-trino --tail=50 2>/dev/null || echo "(init-trino logs unavailable)"
          echo "=== pipeline logs ==="
          kubectl logs -l component=pipeline-job -n analytics -c pipeline --tail=100 2>/dev/null || echo "(pipeline logs unavailable)"
          exit 1

      - name: Heartbeat
        run: echo "Deployment Complete"