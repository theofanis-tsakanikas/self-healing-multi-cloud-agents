name: Destroy Cloud Infrastructure

# Manual, irreversible teardown of a cloud's ENTIRE footprint — bootstrap (cluster,
# DB, registry, IAM) + the agent-generated pipeline infra. Mirrors run_agent.yml's
# single-file, cloud-selector pattern: one workflow, pick the cloud.
#
# Each cloud keeps ONLY its manually-created terraform state backend:
#   AWS   → s3://multi-cloud-agent-bootstrap-state
#   Azure → the tfstate storage account is bootstrap-managed and IS destroyed;
#           nothing manual to keep (Azure backend lives inside the bootstrap RG).
#   GCP   → gs://multi-cloud-agent-bootstrap-tfstate (the bootstrap's OWN backend, kept).
#           The agent state bucket gs://multi-cloud-agent-tfstate is bootstrap-created and
#           IS destroyed. GKE deletion_protection + the prevent_destroy data bucket are
#           handled in-job (state rm + gcloud).
#
# A typed confirmation guards every run.

on:
  workflow_dispatch:
    inputs:
      cloud:
        description: 'Which cloud to destroy'
        required: true
        type: choice
        options:
          - aws
          - azure
          - gcp
          - databricks
        default: aws
      confirm:
        description: 'Type exactly "destroy" to confirm — this is irreversible.'
        required: true
        default: ''

permissions:
  contents: read   # terraform authenticates with cloud credentials, not GITHUB_TOKEN

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  #  AWS
  # ════════════════════════════════════════════════════════════════════════════
  destroy-aws:
    if: inputs.confirm == 'destroy' && inputs.cloud == 'aws'
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.BOOTSTRAP_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BOOTSTRAP_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION:    ${{ vars.AWS_DEFAULT_REGION }}
      DATA_BUCKET:    eu-sales-insights-data
      STATE_BUCKET:   multi-cloud-agent-tf-state-bucket
      CLUSTER_NAME:   multi-cloud-agent-cluster

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.9"

      # Phase 0: delete K8s LoadBalancer Services so their ELBs don't orphan the VPC.
      - name: Delete K8s LoadBalancer Services
        continue-on-error: true
        run: |
          if aws eks update-kubeconfig --region "$AWS_DEFAULT_REGION" --name "$CLUSTER_NAME" 2>/dev/null; then
            kubectl delete svc --all -n monitoring --ignore-not-found=true || true
            kubectl delete svc --all -n analytics  --ignore-not-found=true || true
            echo "Waiting 30s for the load balancers to deprovision..."
            sleep 30
          else
            echo "Cluster not reachable (already destroyed?) — skipping LB cleanup."
          fi

      # Phase 1: agent pipeline terraform (S3 data bucket + IAM). Bucket is versioned
      # and prevent_destroy-guarded — empty fully, detach from state, terraform destroy
      # the rest, then CLI-delete the bucket last.
      - name: Destroy agent pipeline infra (S3 + IAM)
        working-directory: terraform
        run: |
          terraform init -input=false
          echo "Emptying data bucket $DATA_BUCKET (current objects)..."
          aws s3 rm "s3://$DATA_BUCKET" --recursive || true
          echo "Removing all object versions..."
          aws s3api list-object-versions --bucket "$DATA_BUCKET" \
            --query '{Objects: Versions[].{Key:Key,VersionId:VersionId}}' --output json > dv.json 2>/dev/null || echo '{}' > dv.json
          if grep -q '"Key"' dv.json; then aws s3api delete-objects --bucket "$DATA_BUCKET" --delete file://dv.json || true; fi
          echo "Removing all delete markers..."
          aws s3api list-object-versions --bucket "$DATA_BUCKET" \
            --query '{Objects: DeleteMarkers[].{Key:Key,VersionId:VersionId}}' --output json > dm.json 2>/dev/null || echo '{}' > dm.json
          if grep -q '"Key"' dm.json; then aws s3api delete-objects --bucket "$DATA_BUCKET" --delete file://dm.json || true; fi
          for res in \
            aws_s3_bucket.data_bucket \
            aws_s3_bucket_ownership_controls.ownership_controls \
            aws_s3_bucket_public_access_block.public_access_block \
            aws_s3_bucket_versioning.versioning \
            aws_s3_bucket_server_side_encryption_configuration.encryption \
            aws_s3_bucket_lifecycle_configuration.lifecycle ; do
            terraform state rm "$res" 2>/dev/null || true
          done
          terraform destroy -auto-approve -input=false || true
          aws s3api delete-bucket --bucket "$DATA_BUCKET" --region "$AWS_DEFAULT_REGION" || true
          echo "✅ Agent pipeline infra destroyed."

      # Phase 2: empty the agent state bucket so bootstrap can delete it.
      - name: Empty agent terraform state bucket
        run: |
          aws s3api list-object-versions --bucket "$STATE_BUCKET" \
            --query '{Objects: Versions[].{Key:Key,VersionId:VersionId}}' --output json > versions.json || echo '{}' > versions.json
          if [ -s versions.json ] && grep -q '"Key"' versions.json; then aws s3api delete-objects --bucket "$STATE_BUCKET" --delete file://versions.json || true; fi
          aws s3api list-object-versions --bucket "$STATE_BUCKET" \
            --query '{Objects: DeleteMarkers[].{Key:Key,VersionId:VersionId}}' --output json > markers.json || echo '{}' > markers.json
          if [ -s markers.json ] && grep -q '"Key"' markers.json; then aws s3api delete-objects --bucket "$STATE_BUCKET" --delete file://markers.json || true; fi
          echo "✅ State bucket emptied."

      # Phase 3: bootstrap (EKS + RDS + ECR + state bucket + lock).
      - name: Destroy bootstrap infra (EKS + RDS + ECR)
        working-directory: bootstrap/aws
        env:
          TF_VAR_rds_allowed_cidrs: ${{ vars.TF_VAR_RDS_ALLOWED_CIDRS }}
          TF_VAR_pipeline_iam_arn:  ${{ vars.TF_VAR_PIPELINE_IAM_ARN }}
        run: |
          terraform init -input=false
          terraform destroy -auto-approve -input=false
          echo "✅ AWS teardown complete. Only s3://multi-cloud-agent-bootstrap-state remains."

  # ════════════════════════════════════════════════════════════════════════════
  #  AZURE
  # ════════════════════════════════════════════════════════════════════════════
  destroy-azure:
    if: inputs.confirm == 'destroy' && inputs.cloud == 'azure'
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID:       ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET:   ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID:       ${{ secrets.ARM_TENANT_ID }}
      TF_VAR_subscription_id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      TF_VAR_db_password:     ${{ secrets.AZURE_DB_PASSWORD }}
      RESOURCE_GROUP:  multi-cloud-agent-rg
      AKS_CLUSTER:     multi-cloud-agent-aks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.9"

      - name: Azure login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Phase 0: delete AKS LoadBalancer Services so their Azure LBs don't orphan.
      - name: Delete K8s LoadBalancer Services
        continue-on-error: true
        run: |
          if az aks get-credentials --resource-group "$RESOURCE_GROUP" --name "$AKS_CLUSTER" --overwrite-existing 2>/dev/null; then
            kubectl delete svc --all -n monitoring --ignore-not-found=true || true
            kubectl delete svc --all -n analytics  --ignore-not-found=true || true
            echo "Waiting 30s for the load balancers to deprovision..."
            sleep 30
          else
            echo "AKS not reachable (already destroyed?) — skipping LB cleanup."
          fi

      # Phase 1: agent pipeline terraform (ADLS container + role assignment).
      - name: Destroy agent pipeline infra (storage + identity)
        working-directory: terraform
        continue-on-error: true
        run: |
          terraform init -input=false || true
          terraform destroy -auto-approve -input=false || true
          echo "✅ Agent pipeline infra destroyed (or already absent)."

      # Phase 2: bootstrap (AKS + ACR + storage + Postgres + managed identity).
      # The whole bootstrap lives in one resource group; terraform destroy removes it all,
      # including the tfstate storage account (Azure backend is inside the bootstrap RG).
      - name: Destroy bootstrap infra (AKS + ACR + Postgres)
        working-directory: bootstrap/azure
        run: |
          terraform init -input=false
          terraform destroy -auto-approve -input=false
          echo "✅ Azure bootstrap destroyed."

      # Safety net: if any resource lingered outside terraform state, drop the whole RG.
      - name: Delete resource group (safety net)
        continue-on-error: true
        run: |
          if az group exists --name "$RESOURCE_GROUP" | grep -q true; then
            echo "Resource group $RESOURCE_GROUP still present — deleting to ensure zero cost."
            az group delete --name "$RESOURCE_GROUP" --yes --no-wait || true
          else
            echo "Resource group already gone ✅."
          fi
          echo "✅ Azure teardown complete."

  # ════════════════════════════════════════════════════════════════════════════
  #  GCP
  # ════════════════════════════════════════════════════════════════════════════
  destroy-gcp:
    if: inputs.confirm == 'destroy' && inputs.cloud == 'gcp'
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID:     ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_project_id:  ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_db_password: ${{ secrets.MYSQL_DB_PASSWORD }}
      GKE_CLUSTER:        multi-cloud-agent-gke
      GKE_REGION:         europe-west3
      DATA_BUCKET:        global-marketing-insights-data
      STATE_BUCKET:       multi-cloud-agent-tfstate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.9"
          terraform_wrapper: false

      - name: GCP auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_JSON }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: gke-gcloud-auth-plugin

      # Phase 0: delete K8s LoadBalancer Services so their GCP LBs don't orphan.
      - name: Delete K8s LoadBalancer Services
        continue-on-error: true
        run: |
          if gcloud container clusters get-credentials "$GKE_CLUSTER" --region "$GKE_REGION" --project "$GCP_PROJECT_ID" 2>/dev/null; then
            kubectl delete svc --all -n monitoring --ignore-not-found=true || true
            kubectl delete svc --all -n analytics  --ignore-not-found=true || true
            echo "Waiting 30s for the load balancers to deprovision..."
            sleep 30
          else
            echo "GKE not reachable (already destroyed?) — skipping LB cleanup."
          fi

      # Phase 1: agent pipeline terraform (GCS data bucket + processed/ object + bucket IAM).
      # The data bucket is prevent_destroy-guarded AND non-empty (parquet/metastore), so
      # terraform cannot destroy it — detach it (+ the processed/ object + IAM) from state,
      # then nuke it via gcloud (recursive removes all object versions + the bucket itself).
      - name: Destroy agent pipeline infra (GCS + IAM)
        working-directory: terraform
        continue-on-error: true
        run: |
          terraform init -input=false || true
          for res in \
            google_storage_bucket.data \
            google_storage_bucket_object.processed_dir \
            google_storage_bucket_iam_member.pipeline ; do
            terraform state rm "$res" 2>/dev/null || true
          done
          terraform destroy -auto-approve -input=false || true
          echo "Nuking data bucket gs://$DATA_BUCKET (all versions + bucket)..."
          gcloud storage rm --recursive "gs://$DATA_BUCKET" --quiet || true
          echo "✅ Agent pipeline infra destroyed."

      # Phase 2: bootstrap (GKE + Cloud SQL + Artifact Registry + SA + state bucket).
      # Two destroy-blockers (GKE deletion_protection, state-bucket force_destroy) are read
      # from STATE at destroy time. gke.tf / storage.tf now set them destroy-friendly, so a
      # targeted apply flips just those two in place — no state surgery, outputs stay valid.
      # (Bootstrap's OWN state lives in the separate multi-cloud-agent-bootstrap-tfstate bucket.)
      - name: Destroy bootstrap infra (GKE + Cloud SQL + AR)
        working-directory: bootstrap/gcp
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false \
            -target=google_container_cluster.main \
            -target=google_storage_bucket.tfstate
          terraform destroy -auto-approve -input=false
          echo "✅ GCP bootstrap destroyed."

  # ════════════════════════════════════════════════════════════════════════════
  #  DATABRICKS  (host cloud = AWS — S3 DBFS root + cross-account IAM)
  # ════════════════════════════════════════════════════════════════════════════
  destroy-databricks:
    if: inputs.confirm == 'destroy' && inputs.cloud == 'databricks'
    runs-on: ubuntu-latest
    env:
      # Phase 1 (pipeline job + secret scope) is workspace-level → HOST/TOKEN.
      DATABRICKS_HOST:          ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN:         ${{ secrets.DATABRICKS_TOKEN }}
      # Phase 2 (workspace + metastore) is account-level → service principal.
      DATABRICKS_ACCOUNT_ID:    ${{ secrets.DATABRICKS_ACCOUNT_ID }}
      DATABRICKS_CLIENT_ID:     ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      AWS_ACCESS_KEY_ID:     ${{ secrets.BOOTSTRAP_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BOOTSTRAP_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION:    eu-central-1
      TF_VAR_account_id:     ${{ secrets.DATABRICKS_ACCOUNT_ID }}
      TF_VAR_bucket_name:    ${{ vars.DATABRICKS_DBFS_BUCKET }}
      # Required (no default) by BOTH the pipeline terraform (job run_as) and the bootstrap
      # (cluster single_user_name). Without it `terraform apply`/`destroy` aborts "No value for
      # required variable databricks_client_id" → the workspace is never destroyed → cost lingers.
      TF_VAR_databricks_client_id: ${{ secrets.DATABRICKS_CLIENT_ID }}
      # The source RDS password is auto-generated (state) — no TF_VAR needed for destroy.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.9"

      # Phase 1: pipeline terraform (databricks_job + secret scope) — no buckets, no prevent_destroy.
      - name: Destroy agent pipeline infra (job + secret scope)
        working-directory: terraform
        continue-on-error: true
        # DB connection comes from SSM data sources (job-level AWS creds) — no TF_VAR_db_*.
        run: |
          terraform init -input=false || true
          terraform destroy -auto-approve -input=false || true
          echo "✅ Agent pipeline infra destroyed (or already absent)."

      # Phase 2: bootstrap (workspace + cluster + warehouse + Unity Catalog + S3 + IAM).
      # The DBFS-root bucket, metastore, catalog, the `raw` schema, the storage credential AND the
      # external location all carry force_destroy in the .tf; a targeted apply flips those in state,
      # then terraform destroy removes everything. They need it because the Spark job creates
      # managed tables at RUNTIME (not in terraform): without force, destroy fails first on
      # "Schema 'raw' is not empty", then on "external location has N dependent managed tables".
      # The underlying S3 data is still purged via the dbfs_root bucket's own force_destroy.
      # (Bootstrap state lives in s3://multi-cloud-agent-bootstrap-state, kept.)
      - name: Destroy bootstrap infra (workspace + Unity Catalog + S3)
        working-directory: bootstrap/databricks
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false \
            -target=aws_s3_bucket.dbfs_root \
            -target=databricks_metastore.this \
            -target=databricks_catalog.main \
            -target=databricks_schema.raw \
            -target=databricks_storage_credential.s3 \
            -target=databricks_external_location.s3
          terraform destroy -auto-approve -input=false
          echo "✅ Databricks teardown complete."
