name: Security

# Three scanners, three blast radii:
#   gitleaks      → secrets anywhere in git history (blocking)
#   trivy fs      → known CVEs in locked dependencies + secrets in the worktree (blocking)
#   trivy config  → IaC misconfigurations across Terraform/K8s/Dockerfile (REPORT-ONLY:
#                   the public-endpoint findings are the documented demo posture — see
#                   SECURITY.md "Deliberate demo trade-offs" — so they must not gate CI)

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'   # weekly sweep — catches newly published CVEs with no code change

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (git history)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # on pull_request events the action lists the PR's commits (403 without this — seen on Dependabot PRs)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history — gitleaks scans every commit
      - uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    name: Dependency CVEs (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          # policy/fixtures holds DELIBERATELY-unsafe artifacts that prove the security gate refuses
          # them (tests/test_security_gate.py). They contain fake credential literals by design, so
          # they must be excluded from the secret scanner — they are never deployed.
          skip-dirs: policy/fixtures

  iac-scan:
    name: IaC misconfig (report-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '0'   # report-only: public DB endpoints etc. are the documented demo posture (SECURITY.md)
