name: Run Multi-Cloud Self-Healing Agent

on:
  workflow_dispatch:
    inputs:
      pipeline_input:
        description: >
          Pipeline name (e.g. eu_sales) or a natural-language description
          (e.g. "daily sales data from PostgreSQL to S3")
        required: true
        type: string

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Run agent
        env:
          # ── LLM ─────────────────────────────────────────────────────────────
          LLM_MODEL:         ${{ vars.LLM_MODEL }}
          LLM_TIMEOUT_SEC:   ${{ vars.LLM_TIMEOUT_SEC }}
          LLM_MAX_RETRIES:   ${{ vars.LLM_MAX_RETRIES }}
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

          # ── Vector Store ─────────────────────────────────────────────────────
          PINECONE_API_KEY:    ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: ${{ vars.PINECONE_INDEX_NAME }}

          # ── GitHub ───────────────────────────────────────────────────────────
          GITHUB_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

          # ── AWS — credentials for SSM access (DB config read from SSM at runtime)
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    ${{ vars.AWS_DEFAULT_REGION }}

          # ── MySQL — GCP Cloud SQL (global_marketing pipeline) ─────────────────
          # Host/user/name are non-sensitive. Password read from .bootstrap_outputs
          # or env var until GCP Secret Manager is configured.
          MYSQL_DB_HOST:     ${{ vars.MYSQL_DB_HOST }}
          MYSQL_DB_PORT:     ${{ vars.MYSQL_DB_PORT }}
          MYSQL_DB_USER:     ${{ vars.MYSQL_DB_USER }}
          MYSQL_DB_NAME:     ${{ vars.MYSQL_DB_NAME }}
          MYSQL_DB_PASSWORD: ${{ secrets.MYSQL_DB_PASSWORD }}

          # ── Trino & Prometheus ────────────────────────────────────────────────
          TRINO_HOST:     ${{ vars.TRINO_HOST }}
          TRINO_PORT:     ${{ vars.TRINO_PORT }}
          TRINO_USER:     ${{ vars.TRINO_USER }}
          PROMETHEUS_URL: ${{ vars.PROMETHEUS_URL }}

        run: uv run python main.py "${{ github.event.inputs.pipeline_input }}"
