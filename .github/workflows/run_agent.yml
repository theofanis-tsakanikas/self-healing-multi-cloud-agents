name: Run Multi-Cloud Self-Healing Agent

on:
  workflow_dispatch:
    inputs:

      pipeline:
        description: 'Pipeline to run (skip = only run the selected steps above)'
        required: true
        type: choice
        options:
          - skip
          - eu_sales
          - global_marketing
          - us_crm
          - sales_lakehouse
        default: eu_sales

      bootstrap_cloud:
        description: 'Provision baseline infrastructure? (first setup only)'
        required: true
        type: choice
        options:
          - skip
          - aws
          - azure
          - gcp
          - databricks
          - all
        default: skip

      sync_knowledge_base:
        description: 'Sync Knowledge Base to Pinecone?'
        required: true
        type: choice
        options:
          - skip
          - sync
        default: skip

      inject_chaos:
        description: 'Inject dirty/chaos data into the database?'
        required: true
        type: choice
        options:
          - skip
          - inject
        default: skip

      chaos_target:
        description: 'Chaos target pipeline (only if inject_chaos = inject)'
        required: false
        type: choice
        options:
          - eu_sales
          - global_marketing
          - us_crm
          - all
        default: eu_sales

      chaos_db_type:
        description: 'Database type for chaos injection'
        required: false
        type: choice
        options:
          - postgres
          - mysql
          - sqlite
        default: postgres

      chaos_rows:
        description: 'Number of dirty rows to inject'
        required: false
        default: '100'
        type: string

jobs:
  run-agent:
    runs-on: ubuntu-latest

    env:
      # ── LangSmith Tracing ────────────────────────────────────────────────────
      LANGCHAIN_TRACING_V2: ${{ vars.LANGCHAIN_TRACING_V2 }}
      LANGCHAIN_PROJECT:    ${{ vars.LANGCHAIN_PROJECT }}
      LANGCHAIN_API_KEY:    ${{ secrets.LANGCHAIN_API_KEY }}

      # ── LLM ─────────────────────────────────────────────────────────────────
      LLM_MODEL:         ${{ vars.LLM_MODEL }}
      LLM_TIMEOUT_SEC:   ${{ vars.LLM_TIMEOUT_SEC }}
      LLM_MAX_RETRIES:   ${{ vars.LLM_MAX_RETRIES }}
      OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # ── Vector Store ─────────────────────────────────────────────────────────
      PINECONE_API_KEY:    ${{ secrets.PINECONE_API_KEY }}
      PINECONE_INDEX_NAME: ${{ vars.PINECONE_INDEX_NAME }}

      # ── GitHub ───────────────────────────────────────────────────────────────
      GITHUB_TOKEN:      ${{ secrets.GH_PAT }}
      GITHUB_REPOSITORY: ${{ github.repository }}

      # ── AWS — credentials for SSM access (DB config read from SSM at runtime)
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION:    ${{ vars.AWS_DEFAULT_REGION }}

      # ── MySQL — GCP Cloud SQL (global_marketing pipeline) ─────────────────────
      MYSQL_DB_HOST:     ${{ vars.MYSQL_DB_HOST }}
      MYSQL_DB_PORT:     ${{ vars.MYSQL_DB_PORT }}
      MYSQL_DB_USER:     ${{ vars.MYSQL_DB_USER }}
      MYSQL_DB_NAME:     ${{ vars.MYSQL_DB_NAME }}
      MYSQL_DB_PASSWORD: ${{ secrets.MYSQL_DB_PASSWORD }}

      # ── GCP — auth for infra-agent Terraform (GCS bucket + SA + IAM) + registry assembly.
      # The google provider reads GOOGLE_CREDENTIALS as the SA-key JSON *content* (same secret
      # the bootstrap step writes to a file for GOOGLE_APPLICATION_CREDENTIALS; a static env:
      # block cannot write a file, so the content form is the correct equivalent here).
      GCP_PROJECT_ID:     ${{ vars.GCP_PROJECT_ID }}
      GOOGLE_CREDENTIALS: ${{ secrets.GCP_SA_KEY_JSON }}

      # ── Azure — ARM auth (infra agent runs pipeline-level Terraform: storage + MI) ─
      ARM_CLIENT_ID:       ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET:   ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID:       ${{ secrets.ARM_TENANT_ID }}

      # ── PostgreSQL — Azure Database (us_crm pipeline) ─────────────────────────
      # The pipeline connects with the SAME password the bootstrap set on the server,
      # so CRM_DB_PASSWORD is sourced from the single AZURE_DB_PASSWORD secret — one
      # password, no risk of a silent mismatch between bootstrap and pipeline.
      CRM_DB_HOST:     ${{ vars.CRM_DB_HOST }}
      CRM_DB_PORT:     ${{ vars.CRM_DB_PORT }}
      CRM_DB_USER:     ${{ vars.CRM_DB_USER }}
      CRM_DB_NAME:     ${{ vars.CRM_DB_NAME }}
      CRM_DB_PASSWORD: ${{ secrets.AZURE_DB_PASSWORD }}

      # ── Databricks — provider auth for the infra agent's pipeline-level Terraform
      # (databricks_job + secret scope) and the databricks-cli deploy workflow.
      DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      # The Databricks pipeline terraform reads the EU-Sales Postgres connection as TF_VARs:
      # host/name/user are non-sensitive (job parameters), only the password is a secret.
      # Unused on non-databricks runs (their pipeline terraform has no db_* variables).
      TF_VAR_db_host:     ${{ vars.POSTGRES_DB_HOST }}
      TF_VAR_db_name:     ${{ vars.POSTGRES_DB_NAME }}
      TF_VAR_db_user:     ${{ vars.POSTGRES_DB_USER }}
      TF_VAR_db_password: ${{ secrets.POSTGRES_DB_PASSWORD }}

      # ── Trino & Prometheus ────────────────────────────────────────────────────
      TRINO_HOST:     ${{ vars.TRINO_HOST }}
      TRINO_PORT:     ${{ vars.TRINO_PORT }}
      TRINO_USER:     ${{ vars.TRINO_USER }}
      PROMETHEUS_URL: ${{ vars.PROMETHEUS_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      # ── STEP 1: Bootstrap (optional, first setup only) ───────────────────────
      # Terraform is always installed — the infra agent uses it for pipeline-level
      # infrastructure (S3 bucket, IAM policy) even when bootstrap is skipped.
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
          # Disable the output-capturing wrapper: with it ON, a failed `terraform apply`
          # surfaces only as a generic "Terraform exited with code 1" and the real
          # `│ Error:` block is swallowed. No step consumes the wrapper's stdout/exitcode
          # outputs, so turning it off is pure error visibility (no behavioural change).
          terraform_wrapper: false

      - name: Bootstrap — AWS
        if: inputs.bootstrap_cloud == 'aws' || inputs.bootstrap_cloud == 'all'
        working-directory: bootstrap/aws
        env:
          # Bootstrap uses a dedicated admin IAM user — NOT the runtime service account.
          # The runtime user (AWS_ACCESS_KEY_ID) has only SSM read permissions.
          AWS_ACCESS_KEY_ID:     ${{ secrets.BOOTSTRAP_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BOOTSTRAP_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    ${{ vars.AWS_DEFAULT_REGION }}
          TF_VAR_rds_allowed_cidrs: ${{ vars.TF_VAR_RDS_ALLOWED_CIDRS }}
          TF_VAR_pipeline_iam_arn:  ${{ vars.TF_VAR_PIPELINE_IAM_ARN }}
        run: |
          terraform init
          terraform apply -auto-approve
          echo "✅ AWS bootstrap complete. RDS + EKS + SSM populated."

      - name: Bootstrap — Azure
        if: inputs.bootstrap_cloud == 'azure' || inputs.bootstrap_cloud == 'all'
        working-directory: bootstrap/azure
        env:
          ARM_CLIENT_ID:       ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET:   ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID:       ${{ secrets.ARM_TENANT_ID }}
          TF_VAR_subscription_id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          TF_VAR_db_password:  ${{ secrets.AZURE_DB_PASSWORD }}
        run: |
          terraform init
          terraform apply -auto-approve
          echo "✅ Azure bootstrap complete. AKS + ACR + PostgreSQL provisioned."

      - name: Bootstrap — GCP
        if: inputs.bootstrap_cloud == 'gcp' || inputs.bootstrap_cloud == 'all'
        working-directory: bootstrap/gcp
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          # db_password is a required (no-default) variable in bootstrap/gcp/variables.tf —
          # without it `terraform apply` blocks prompting for input and the bootstrap fails.
          TF_VAR_db_password: ${{ secrets.MYSQL_DB_PASSWORD }}
          # NOTE: pipeline_github_repo is intentionally left at its empty default so the
          # GitHub-Actions Workload Identity Federation pool is NOT created — the deploy
          # authenticates with the SA key (GCP_SA_KEY_JSON), so the WIF pool is unused infra
          # and creating it needs an extra elevated permission (workloadIdentityPoolAdmin).
        run: |
          echo '${{ secrets.GCP_SA_KEY_JSON }}' > /tmp/gcp-sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-sa.json
          terraform init
          terraform apply -auto-approve

          # NOTE: do NOT add a manual GRANT step here. Cloud SQL MySQL grants the
          # API-created pipeline_user (google_sql_user) its default privileges automatically.
          # Running `gcloud sql users set-password <user> --host=%` out-of-band CREATES a
          # second, privilege-less <user>@% entry that shadows the real one on remote
          # connections → 1044 "Access denied to database". Manage these users only via
          # terraform; never set-password/create them with a different --host by hand.

          rm /tmp/gcp-sa.json
          echo "✅ GCP bootstrap complete. GKE + Artifact Registry + Cloud SQL provisioned."

      - name: Bootstrap — Databricks
        if: inputs.bootstrap_cloud == 'databricks' || inputs.bootstrap_cloud == 'all'
        working-directory: bootstrap/databricks
        env:
          # The account-level provider (creates the workspace + Unity Catalog metastore) auths
          # with an ACCOUNT SERVICE PRINCIPAL — not a workspace token, which does not exist until
          # the workspace is created. The workspace-level provider re-uses the same SP.
          DATABRICKS_ACCOUNT_ID:    ${{ secrets.DATABRICKS_ACCOUNT_ID }}
          DATABRICKS_CLIENT_ID:     ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          # host_cloud = aws → S3 DBFS root + cross-account IAM + remote state backend.
          AWS_ACCESS_KEY_ID:     ${{ secrets.BOOTSTRAP_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BOOTSTRAP_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    eu-central-1
          # Required bootstrap variables (no defaults).
          TF_VAR_account_id:  ${{ secrets.DATABRICKS_ACCOUNT_ID }}
          TF_VAR_bucket_name: ${{ vars.DATABRICKS_DBFS_BUCKET }}
          # Source RDS Postgres password (same secret the pipeline + seeding use).
          TF_VAR_db_password: ${{ secrets.POSTGRES_DB_PASSWORD }}
        run: |
          terraform init
          terraform apply -auto-approve
          echo "✅ Databricks bootstrap complete. Workspace + Unity Catalog provisioned."

      # ── STEP 2: Sync Knowledge Base (optional) ───────────────────────────────
      - name: Sync Knowledge Base to Pinecone
        if: inputs.sync_knowledge_base == 'sync'
        run: uv run python scripts/ingest_to_pinecone.py

      # ── STEP 3: Inject chaos data (optional) ────────────────────────────────
      - name: Inject chaos data
        if: inputs.inject_chaos == 'inject'
        run: |
          uv run python scripts/seed_chaos.py \
            --target "${{ inputs.chaos_target }}" \
            --db-type "${{ inputs.chaos_db_type }}" \
            --rows "${{ inputs.chaos_rows }}"

      # ── STEP 4: Run the agent ────────────────────────────────────────────────
      - name: Run agent
        if: inputs.pipeline != 'skip'
        run: uv run python main.py "${{ inputs.pipeline }}"
