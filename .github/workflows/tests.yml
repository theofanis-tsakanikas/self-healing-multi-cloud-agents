name: Tests

# Fast, hermetic unit tests for the agent/orchestration logic. No cloud, no
# credentials, no infrastructure — every external dependency (LLM, AWS/SSM,
# Pinecone, GitHub API, the clock) is mocked or injected. This guards the
# deterministic logic (validators, routing, cloud_get, state helpers) on every
# push/PR without ever provisioning anything.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'dashboards/**'
      - 'data/**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies (incl. dev group)
        run: uv sync --group dev

      - name: Lint (ruff, whole repo)
        # Generated pipeline scripts are excluded via [tool.ruff] extend-exclude —
        # they have their own validation gate at generation time.
        run: uv run ruff check .

      - name: Run unit tests + coverage (no cloud, no credentials)
        # fail_under is enforced via [tool.coverage.report] in pyproject.toml.
        run: uv run pytest --cov --cov-report=term-missing

      - name: Medic self-heal eval (offline replay — routing + evidence-gate regression net)
        # Scores the REAL Medic routing + evidence gate against evals/corpus/corpus.json and
        # fails if the committed report is stale or any deterministic check regressed. No LLM.
        run: make eval-check

      - name: Security gate over the generated infra (blocking)
        # Blocks a committed generated bundle with HIGH findings (unsafe Dockerfile / manifest /
        # workflow / Terraform). The same gate also runs pre-push inside push_to_github at deploy time.
        run: make security-gate

  terraform-fmt:
    # Formatting gate for the HAND-WRITTEN Terraform only (bootstrap/). The
    # pipeline stack under terraform/ is an agent-generated output with its own
    # validation path — not gated here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: terraform fmt -check (bootstrap/)
        run: terraform fmt -check -recursive bootstrap/
