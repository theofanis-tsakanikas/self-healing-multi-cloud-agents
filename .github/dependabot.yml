# Automated dependency updates. Python deps resolve through uv (pyproject +
# uv.lock); GitHub Actions pins are bumped per workflow file. The generated
# pipeline workflow (pipe_*.yml) is an agent OUTPUT — Dependabot PRs against
# it are fine to close: the standard owns its action versions.
version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    # Refresh uv.lock within the EXISTING pyproject ranges. The default
    # bump_versions strategy raises the pyproject floors to the newest
    # release, which conflicts with transitive caps (e.g. raising
    # pyarrow>=16 to >=24 collides with langchain-google-vertexai's
    # pyarrow<24 cap) and fails the whole job with
    # dependency_file_not_resolvable. Floors stay human-managed.
    versioning-strategy: lockfile-only
    groups:
      python-deps:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # Major action bumps are reviewed manually: the cloud workflows
      # (run_agent/destroy/power/cleanup + the generated deploy) only run on
      # workflow_dispatch, so a PR's green CI never exercises them — and the
      # generated workflow's action versions are owned by the CI/CD standard,
      # not by this repo's files. Minor/patch (incl. security) flow normally.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
