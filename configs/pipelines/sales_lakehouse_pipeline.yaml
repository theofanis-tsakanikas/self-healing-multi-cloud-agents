pipeline_id: "pipe_sales_lakehouse"
owner: "analytics_team"
project_name: "sales-lakehouse-insights"
project_folder_name: "multi-cloud-self-healing-agent"

# 1. SOURCE (dedicated Lakehouse RDS Postgres — own instance/db/table, provisioned by
#    bootstrap/databricks/database.tf; same sales SCHEMA as eu_sales)
source_config: "configs/databases/postgres_lakehouse.yaml"

# 2. LOGIC (reuse EU Sales business rules — same sales schema)
business_rules_config: "configs/business_rules/sales_logic.yaml"

# 3. DESTINATION (Databricks Delta Lake on Unity Catalog)
target_infra_config: "configs/infra/databricks.yaml"

# 4. METADATA
data_domain: "sales"
priority: "high"
update_frequency: "daily"
# Databricks host_cloud = aws → storage is S3, jobs cluster runs on AWS.
# cloud_provider stays "aws" for any unbranched host-cloud code path; the
# Databricks-ness is signalled by target_infra_config.provider == "databricks".
cloud_provider: "aws"

# 5. DATABRICKS HOST INFRASTRUCTURE (host_cloud = aws → aws_setup)
aws_setup:
  bucket_name: "multi-cloud-agent-lakehouse"   # workspace DBFS root + Unity Catalog managed storage
  region: "eu-central-1"
  # Pipeline terraform state → the long-lived bootstrap-state bucket (distinct key). The old
  # multi-cloud-agent-tf-state-bucket was created by the AWS bootstrap (torn down); the
  # bootstrap-state bucket already exists and the agent user has read/write to it — self-contained.
  state_bucket: "multi-cloud-agent-bootstrap-state"
  state_key: "terraform/sales-lakehouse/terraform.tfstate"
  lock_table: "terraform-state-lock"

# 6. UNITY CATALOG / DELTA TARGET (concrete coords created by bootstrap/databricks)
databricks_target:
  catalog: "multi_cloud_agent_workspace"   # = replace(workspace_name, "-", "_")
  schema: "raw"
  table_name: "pipe_sales_lakehouse"

# 7. ARTIFACT PATHS — Databricks needs a Spark job + Unity Catalog DDL + a Lakeview
#    observability dashboard JSON. NO Trino SQL, NO Grafana JSON, NO requirements.txt,
#    NO K8s/Dockerfile (Lakeview replaces Grafana/Prometheus; there is no K8s here).
project_structure:
  python_dir: scripts
  python_script_path: scripts/pipe_sales_lakehouse.py
  sql_dir: sql
  unity_catalog_sql_path: sql/setup_unity_catalog.sql
  dashboards_dir: dashboards
  dashboard_path: dashboards/pipe_sales_lakehouse_lakeview.json

# Databricks artifact set — overrides DEFAULT_REQUIRED_ARTIFACTS (which is K8s/Trino-centric).
required_artifacts:
  - scripts/pipe_sales_lakehouse.py
  - sql/setup_unity_catalog.sql
  - dashboards/pipe_sales_lakehouse_lakeview.json
