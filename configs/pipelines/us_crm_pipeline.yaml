pipeline_id: "pipe_crm_us_to_azure"
owner: "customer_success_direct"
project_name: "us-crm-insights"
project_folder_name: "multi-cloud-self-healing-agent"

# 1. SOURCE
source_config: "configs/databases/postgres_crm.yaml"

# 2. LOGIC
business_rules_config: "configs/business_rules/crm_logic.yaml"

# 3. DESTINATION
target_infra_config: "configs/infra/azure_blob.yaml"

# 4. SHARED INFRASTRUCTURE
shared_services:
  trino:
    host: "trino.analytics.svc.cluster.local"
    port: 8080
    catalog: "hive"   # always "hive" — the hive-catalog-config ConfigMap key is hive.properties → Trino catalog name is "hive" (same as AWS/GCP)
    schema: "crm_us"
    table_name: "pipe_crm_us_to_azure"
  grafana:
    url: "http://grafana.monitoring.svc.cluster.local"
    namespace: "monitoring"

# 5. METADATA
data_domain: "crm"
priority: "medium"
pii_sensitive: true
cloud_provider: "azure"

# 6. CLOUD INFRASTRUCTURE SPECIFICS (Azure)
azure_setup:
  storage_account_name: "uscrminsightsstorage"
  container_name: "us-crm-insights-data"
  region: "westeurope"
  resource_group_name: "multi-cloud-agent-rg"
  managed_identity_name: "us-crm-insights-identity"
  k8s_namespace: "analytics"
  k8s_service_account_name: "us-crm-insights-sa"
  acr_login_server: "mcselfhealagentacr.azurecr.io"
  aks_cluster_name: "multi-cloud-agent-aks"
  state_storage_account: "multicloudagenttfstate"
  state_container: "tfstate"
  state_key: "azure/us-crm-insights/terraform.tfstate"
  subscription_id_env: "AZURE_SUBSCRIPTION_ID"

# 7. ARTIFACT PATHS (where the Architect writes generated files)
project_structure:
  data_dir: data
  monitoring_path: dashboards/monitoring_specs.json
  python_dir: scripts
  python_script_path: scripts/pipe_crm_us_to_azure.py
  requirements_path: requirements.txt
  sql_dir: sql
  trino_setup_path: sql/setup_trino.sql
