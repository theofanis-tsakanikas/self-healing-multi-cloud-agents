# GCP infra config — CONSUMED keys only.
# The GCS storage-class / IAM / public-access / encryption / versioning / lifecycle "standards"
# live in the KB (the GCP terraform standard) — the single owner. They are NOT read from here:
# only the keys below reach an agent (build_architect_context: data_format/compression_type;
# build_infra_context: auth_method; architect: service_name). The GCP infra branch does not read
# object_ownership.
infrastructure_type: "object_storage"
cloud_provider: "gcp"
service_name: "storage_bucket"

data_format: "parquet"
compression_type: "snappy"

auth_method: "gcp_workload_identity"
