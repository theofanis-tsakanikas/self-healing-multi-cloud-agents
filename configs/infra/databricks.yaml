provider: databricks

# Host cloud — Databricks runs ON one of the 3 clouds.
# Pinned to aws: bootstrap/databricks/main.tf provisions AWS resources (S3 DBFS root,
# cross-account IAM) and variables.tf cloud_type defaults to aws — keep all three consistent.
host_cloud: aws            # aws | azure | gcp
host_region: eu-central-1  # matches host_cloud region (AWS)

# Databricks workspace — SHARED, created by bootstrap/databricks (not per-pipeline).
# Must match bootstrap variables.tf `workspace_name` default; the Unity Catalog catalog
# below is derived from it (replace "-" with "_"). `${...}` is NOT resolved by the loader,
# so these values are concrete on purpose.
workspace_name: "multi-cloud-agent-workspace"
databricks_tier: premium   # standard | premium (Unity Catalog requires premium)

# Compute — Jobs cluster (batch pipelines)
jobs_cluster:
  node_type: m5.xlarge         # AWS EC2 instance (4 vCPU, 16 GB RAM) — host_cloud=aws
  num_workers: 2
  autoscale_min: 1
  autoscale_max: 4
  spark_version: "14.3.x-scala2.12"
  runtime_engine: PHOTON        # Photon engine for 3-5x faster Spark

# Compute — SQL Warehouse (analytics / Trino replacement)
sql_warehouse:
  size: XSMALL                  # XSMALL | SMALL | MEDIUM
  auto_stop_mins: 10
  channel: CURRENT

# Storage — Delta Lake backend
delta_storage:
  format: delta
  # Resolves to the host_cloud storage at deploy time:
  #   azure → abfss://{container}@{account}.dfs.core.windows.net/{pipeline_id}/
  #   aws   → s3://{bucket}/{pipeline_id}/
  #   gcp   → gs://{bucket}/{pipeline_id}/
  partition_by: run_date         # Hive-style partitioning

# Unity Catalog — created by bootstrap/databricks. The catalog name = the workspace name
# with hyphens replaced by underscores (bootstrap: replace(workspace_name, "-", "_")).
# MUST agree with the pipeline config's `databricks_target.catalog` — the architect uses
# databricks_target while the infra agent uses this block; a mismatch breaks the job.
unity_catalog:
  enabled: true
  metastore: "multi-cloud-agent-metastore"     # matches bootstrap metastore_name default
  catalog: "multi_cloud_agent_workspace"        # = replace(workspace_name, "-", "_")
  schema: raw

# MLflow (Mosaic AI tracking) — disabled by default. experiment_name is per-pipeline;
# set it concretely when enabling MLflow for a pipeline that trains models.
mlflow:
  enabled: false
  experiment_name: "pipe_sales_lakehouse-experiment"

# State backend (Terraform): the per-pipeline state_bucket / state_key are the single source
# of truth in the PIPELINE config's host-cloud setup (e.g. aws_setup.state_bucket /
# aws_setup.state_key). Not duplicated here to avoid drift between the two files.

# GitHub Actions
cicd:
  runner: ubuntu-latest
  databricks_cli_version: "0.18.0"
