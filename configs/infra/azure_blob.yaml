# Azure infra config — CONSUMED keys only.
# The ADLS storage-tier / hierarchical-namespace / encryption / versioning / soft-delete
# "standards" live in the KB (the Azure terraform standard) — the single owner. They are NOT read
# from here: only the keys below reach an agent (build_architect_context: data_format/
# compression_type; build_infra_context: auth_method, and object_ownership which defaults to
# "private" when absent; architect: service_name).
infrastructure_type: "object_storage"
cloud_provider: "azure"
service_name: "blob_storage"

data_format: "parquet"
compression_type: "snappy"

auth_method: "azure_ad_workload_identity"
