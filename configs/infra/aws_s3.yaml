# AWS Infrastructure Standards for S3 Object Storage
infrastructure_type: "object_storage"
cloud_provider: "aws"
service_name: "s3"

# STORAGE STANDARDS
storage_class: "STANDARD"
data_format: "parquet"
compression_type: "snappy"
block_public_access: true

# SECURITY & ACCESS STANDARDS
auth_method: "aws_iam_oidc_irsa"
object_ownership: "BucketOwnerEnforced"

# ENCRYPTION
encryption:
  type: "sse-kms"
  kms_key_provider: "aws_managed"

# VERSIONING & LIFECYCLE
versioning_enabled: true
lifecycle_rules:
  - id: "transition-to-ia"
    enabled: true
    transition_days: 90
    storage_class: "STANDARD_IA"

# NETWORKING & CONNECTIVITY
target_uri_pattern: "s3a://{bucket_name}/{path}/"

# MONITORING
logging_enabled: true
