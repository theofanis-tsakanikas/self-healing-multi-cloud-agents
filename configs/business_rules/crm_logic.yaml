# Business Rules: US CRM Pipeline
# domain:           Identifies the business area these rules apply to.
# quality_standards: List of data quality rules. Each rule defines WHAT to check,
#                    WHERE to check it, and WHAT to do on failure.
#
# on_failure_action values (the ONLY supported vocabulary — see python_standards.md):
#   DROP_RECORD       — Remove the offending row entirely.
#   EXCLUDE_AND_LOG   — Remove the row and log it as a warning.
#   DEFAULT_VALUE     — Replace the invalid value with the specified default.
#   FLAG_AS_SUSPICIOUS — Keep the row but mark it with a boolean flag column.
#
# NOTE: PII anonymization (mask email/phone, hash full_name) is NOT a quality_standard —
# it is an unconditional transform driven by `pii_sensitive: true` and the objective.

domain: "customer_relationship_management"
domain_description: "Contains PII and unique customer identity markers."

quality_standards:

  - capability: "contact_format_integrity"
    description: "Removes records whose email is structurally invalid and therefore unusable."
    target_criteria: "Columns representing an email address."
    logic: "Email value must contain an '@' character."
    on_failure_action: "EXCLUDE_AND_LOG"

  - capability: "mandatory_contact_info"
    description: "Every customer must have at least one usable contact channel."
    target_criteria: "Email and phone number columns."
    logic: "At least one of the email or phone columns must be non-NULL."
    on_failure_action: "DROP_RECORD"

  - capability: "entity_uniqueness"
    description: "Detects duplicate customer identifiers that break single-source-of-truth."
    target_criteria: "The primary customer identifier column (e.g. cust_id)."
    logic: "Flag rows whose identifier value is duplicated within the dataset."
    on_failure_action: "FLAG_AS_SUSPICIOUS"
